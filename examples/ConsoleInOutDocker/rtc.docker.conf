# Configuration of the master manager that creates ConsoleIn / ConsoleOut in
# Docker containers (rtcd2 -f rtc.docker.conf).
#   create_component("RTC:AIST:example:ConsoleIn:docker:1.0.0")
# The containers are started by rtcd2_docker. The images are built from
# ConsoleIn.docker / ConsoleOut.docker in manager.modules.docker.load_paths.
manager.is_master: YES
manager.corba_servant: YES
manager.shutdown_on_nortcs: NO
manager.shutdown_auto: NO
# The containers register to this address. With a network other than host,
# do not listen only on the loopback address (e.g. giop:tcp:127.0.0.1:2810).
corba.master_manager: giop:tcp::2810

manager.supported_languages: docker
manager.modules.docker.load_paths: /usr/share/openrtm-2.0/components/docker/examples/
manager.modules.docker.manager_cmd: rtcd2_docker
manager.modules.docker.profile_cmd: rtcprof2_docker
manager.modules.docker.suffixes: docker
manager.modules.docker.create_comp: NO
manager.modules.docker.build_comp: YES

# Network of the containers (read by rtcd2_docker; the default is host).
# Options in manager_cmd ("rtcd2_docker -o manager.modules.Docker.network:bridge")
# take precedence over these lines. To choose the mode for each component, give
# a file with these lines in create_component:
#   create_component("RTC:AIST:example:ConsoleOut:docker:1.0.0?config_file=<file>")
#manager.modules.Docker.network: bridge
#manager.modules.Docker.bidirectional: NO
#manager.modules.Docker.port: 2811
#manager.modules.Docker.publish_address: 192.168.0.10
#manager.modules.Docker.master_address: 192.168.0.10
